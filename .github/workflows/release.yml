name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-amd64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc git libcurl4-openssl-dev \
            libsqlite3-dev libjson-c-dev

      - name: Build Concord (dev branch)
        run: |
          git clone https://github.com/Cogmasters/concord.git /tmp/concord
          cd /tmp/concord
          git checkout dev
          make static
          sudo make install
          sudo ldconfig

      - name: Build Yuno
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc"
          cmake --build build -- -j$(nproc)
          strip build/bin/yuno_gasai

      - name: Package
        run: |
          mkdir -p release
          cp build/bin/yuno_gasai release/
          cp config.example.json release/
          cp LICENSE release/
          cp README.md release/
          cd release && tar czf ../yuno_gasai-linux-amd64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: yuno_gasai-linux-amd64
          path: yuno_gasai-linux-amd64.tar.gz

  build-linux-arm64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc git libcurl4-openssl-dev \
            libsqlite3-dev libjson-c-dev

      - name: Build Concord (dev branch)
        run: |
          git clone https://github.com/Cogmasters/concord.git /tmp/concord
          cd /tmp/concord
          git checkout dev
          make static
          sudo make install
          sudo ldconfig

      - name: Build Yuno
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc"
          cmake --build build -- -j$(nproc)
          strip build/bin/yuno_gasai

      - name: Package
        run: |
          mkdir -p release
          cp build/bin/yuno_gasai release/
          cp config.example.json release/
          cp LICENSE release/
          cp README.md release/
          cd release && tar czf ../yuno_gasai-linux-arm64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: yuno_gasai-linux-arm64
          path: yuno_gasai-linux-arm64.tar.gz

  release:
    name: Create Release
    needs: [build-linux-amd64, build-linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/yuno_gasai-linux-amd64/yuno_gasai-linux-amd64.tar.gz
            artifacts/yuno_gasai-linux-arm64/yuno_gasai-linux-arm64.tar.gz
